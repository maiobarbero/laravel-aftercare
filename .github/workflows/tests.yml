name: Test Suite

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        php:
          - '8.3'
          - '8.4'
          - '8.5'

        laravel:
          # Avoid caret constraints: Windows composer.bat can strip the caret.
          - '~12.8'
          - '13.*'

        stability:
          - prefer-lowest
          - prefer-stable

        include:
          - laravel: '~12.8'
            testbench: '10.*'

          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Run tests in parallel
        if: runner.os != 'Windows'
        run: composer test:unit

      # Testbench workers share bootstrap cache manifests; concurrent renames fail on Windows.
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: php vendor/bin/pest
